name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  schedule:
    - cron: "0 6 * * 1"
      timezone: "Europe/Stockholm"

  workflow_dispatch:
    inputs:
      datafil:
        description: "Välj CSV-fil för datavalidering"
        required: true
        type: choice
        default: "data/kundbas.csv"
        options:
          - "data/kundbas.csv"
          - "data/kundbas_ny_leverans.csv"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  andringar:
    name: Kontrollera ändrade filer
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      ci: ${{ steps.decision.outputs.ci }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Identifiera relevanta ändringar
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ci:
              - 'src/**'
              - 'data/**'
              - 'tests/**'
              - 'kontroller/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'Dockerfile'
              - 'docker/**'
              - '.dockerignore'
              - 'scripts/**'
              - 'k8s/**'

      - name: Bestäm om CI behövs
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.ci }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" || "$CHANGED" == "true" ]]; then
            echo "ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "ci=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test Python ${{ matrix.python-version }}
    needs: andringar
    if: needs.andringar.outputs.ci == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --frozen --no-sync --python "${{ matrix.python-version }}" python -m pytest -v

  datakontroll:
    name: Validate customer data
    needs: andringar
    if: needs.andringar.outputs.ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.11"

      - name: Validate customer data
        env:
          DATAFIL: ${{ inputs.datafil || 'data/kundbas.csv' }}
        run: uv run --frozen --no-sync python -m kontroller.validate_data "$DATAFIL"

  train:
    name: Train model
    needs: [test, datakontroll]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.11"

      - name: Train model
        env:
          MLFLOW_RUN_NAME: model-ci-${{ github.run_number }}-${{ github.run_attempt }}
        run: uv run --frozen --no-sync python -m churn.model

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

      - name: Package MLflow results
        run: tar -czf mlflow-tracking.tar.gz mlflow.db mlruns/

      - name: Upload MLflow results
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-${{ github.sha }}
          path: mlflow-tracking.tar.gz
          if-no-files-found: error

  utvardera:
    name: Evaluate model
    needs: train
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.11"

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Evaluate model quality
        run: uv run --frozen --no-sync python -m churn.evaluate

      - name: Write metrics to Summary
        if: always()
        run: |
          if [ -f outputs/matvarden.json ]; then
            echo "## Model evaluation" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/matvarden.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  docker:
    name: Build and smoke-test Docker image
    needs: utvardera
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download approved model
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Verify model commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(
              Path("outputs/matvarden.json").read_text()
          )
          actual = metadata["commit"]
          expected = os.environ["EXPECTED_SHA"]

          if actual != expected:
              raise SystemExit(
                  f"Model commit mismatch: {actual} != {expected}"
              )

          print("PASS: Model commit matches workflow commit")
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare image tag
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:$COMMIT_SHA"
          echo "tag=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build AMD64 image for smoke tests
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: churn-docker:ci

      - name: Run Docker smoke tests
        run: bash scripts/smoke_test.sh churn-docker:ci

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build both platforms and publish on main
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.tag }}

      - name: Inspect published platforms
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: docker buildx imagetools inspect "$IMAGE"

      - name: Pull and verify published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE"
          bash scripts/smoke_test.sh "$IMAGE"
          echo "PASS: Published AMD64 image pulled and verified"

  ringlista:
    name: Generate call list
    needs: utvardera
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.11"

      - name: Download approved model
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Generate call list
        run: uv run --frozen --no-sync python -m churn.score

      - name: Upload call list
        uses: actions/upload-artifact@v4
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv
          if-no-files-found: error

  ci_gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()

    needs:
      - andringar
      - test
      - datakontroll
      - train
      - utvardera
      - docker

    steps:
      - name: Kontrollera pipeline-resultat
        env:
          CHANGES_RESULT: ${{ needs.andringar.result }}
          CI_REQUIRED: ${{ needs.andringar.outputs.ci }}
          TEST_RESULT: ${{ needs.test.result }}
          DATA_RESULT: ${{ needs.datakontroll.result }}
          TRAIN_RESULT: ${{ needs.train.result }}
          EVAL_RESULT: ${{ needs.utvardera.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Ändringskontrollen misslyckades."
            exit 1
          fi

          if [[ "$CI_REQUIRED" == "false" ]]; then
            echo "Endast irrelevanta PR-ändringar. Fullständig CI behövs inte."
            exit 0
          fi

          if [[ "$CI_REQUIRED" != "true" ]]; then
            echo "Ogiltigt värde för CI_REQUIRED."
            exit 1
          fi

          for result in "$TEST_RESULT" "$DATA_RESULT" "$TRAIN_RESULT" "$EVAL_RESULT" "$DOCKER_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "CI misslyckades: minst ett obligatoriskt jobb har resultat $result"
              exit 1
            fi
          done

          echo "Alla obligatoriska CI-jobb passerade."

  deploy:
    name: Deploy to production
    needs: [ci_gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production

    permissions:
      contents: read

    env:
      KUBECONFIG: ${{ runner.temp }}/course-kubeconfig.yaml
      KUBE_CONTEXT: mlops-ht26
      KUBE_NAMESPACE: sadia-awan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          set -euo pipefail
          VERSION="v1.36.5"
          BASE_URL="https://dl.k8s.io/release/$VERSION/bin/linux/amd64"

          curl -fsSL "$BASE_URL/kubectl" -o kubectl
          curl -fsSL "$BASE_URL/kubectl.sha256" -o kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

          kubectl version --client

      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail

          if [[ -z "$KUBE_CONFIG" ]]; then
            echo "KUBE_CONFIG secret is missing."
            exit 1
          fi

          umask 077
          printf '%s\n' "$KUBE_CONFIG" > "$KUBECONFIG"

      - name: Deploy approved image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${REPOSITORY,,}:$COMMIT_SHA"

          # Replace the image locally before applying the manifest.
          kubectl set image \
            -f k8s/deployment.yaml \
            "churn-api=$IMAGE" \
            --local -o yaml > "$RUNNER_TEMP/deployment.yaml"

          kubectl --context "$KUBE_CONTEXT" -n "$KUBE_NAMESPACE" \
            apply -f k8s/service.yaml

          kubectl --context "$KUBE_CONTEXT" -n "$KUBE_NAMESPACE" \
            apply -f "$RUNNER_TEMP/deployment.yaml"

          kubectl --context "$KUBE_CONTEXT" -n "$KUBE_NAMESPACE" \
            rollout status deployment/churn-api --timeout=300s

          ACTUAL_IMAGE=$(kubectl --context "$KUBE_CONTEXT" \
            -n "$KUBE_NAMESPACE" get deployment churn-api \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          if [[ "$ACTUAL_IMAGE" != "$IMAGE" ]]; then
            echo "Deployment image does not match the approved image."
            exit 1
          fi

          kubectl --context "$KUBE_CONTEXT" -n "$KUBE_NAMESPACE" \
            get pods -l app=churn-api

          echo "Deployed image: $IMAGE"
          echo "## Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Namespace: $KUBE_NAMESPACE" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify health and prediction
        run: |
          set -euo pipefail

          kubectl --context "$KUBE_CONTEXT" -n "$KUBE_NAMESPACE" \
            port-forward service/churn-api 8081:80 \
            > "$RUNNER_TEMP/port-forward.log" 2>&1 &

          FORWARD_PID=$!
          trap 'kill "$FORWARD_PID" 2>/dev/null || true' EXIT

          python - <<'PY'
          import json
          import math
          import time
          import urllib.error
          import urllib.request

          base_url = "http://127.0.0.1:8081"

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(
                      f"{base_url}/health", timeout=5
                  ) as response:
                      health = json.load(response)

                  if (
                      health.get("status") == "ok"
                      and health.get("model_loaded") is True
                  ):
                      break
              except (urllib.error.URLError, TimeoutError):
                  pass

              time.sleep(2)
          else:
              raise SystemExit("FAIL: Health check did not pass.")

          customer = {
              "alder": 45,
              "manader_som_kund": 24,
              "manadskostnad": 299,
              "data_gb_per_manad": 15,
              "supportarenden_12m": 2,
              "region": "Stockholm",
              "abonnemang": "Standard",
          }

          request = urllib.request.Request(
              f"{base_url}/predict",
              data=json.dumps(customer).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=10) as response:
              prediction = json.load(response)

          risk = prediction["risk"]

          if not isinstance(risk, (int, float)) or not math.isfinite(risk):
              raise SystemExit("FAIL: Risk is not a finite number.")

          if not 0 <= risk <= 1:
              raise SystemExit("FAIL: Risk is outside 0–1.")

          print("PASS: Health:", health)
          print("PASS: Prediction:", prediction)
          PY

      - name: Remove cluster credentials
        if: always()
        run: rm -f "$KUBECONFIG"